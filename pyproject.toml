[project]
name = "phenoforge"
version = "0.1.0.dev0"
description = "Semantic value set assembly for clinical cohort definitions, over MCP"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "Colby Wilkinson" }]
keywords = ["mcp", "omop", "icd-10-cm", "phenotype", "clinical-research"]

dependencies = [
    "pydantic>=2.7",
    "duckdb>=1.0",
    "lancedb>=0.13",
    "sentence-transformers>=3.0",
    "rank-bm25>=0.2.2",
    "mcp>=1.2",
    "typer>=0.12",
    "httpx>=0.27",
]

[project.optional-dependencies]
agent = ["langgraph>=0.2", "langchain-anthropic>=0.2", "langsmith>=0.1", "python-dotenv>=1.0"]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
    "hypothesis>=6.100",
    "jupyterlab>=4.0",
    "ipykernel>=6.29",
    "ipywidgets>=8.0",
    "pandas>=2.0",
    "matplotlib>=3.8",
]

[project.scripts]
phenoforge-mcp = "phenoforge.mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/phenoforge"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "D", "ANN", "RUF"]
ignore = ["D203", "D213", "ANN101", "ANN102"]

[tool.ruff.lint.pydocstyle]
convention = "pep257"

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D", "ANN"]
"scripts/*" = ["B008"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=phenoforge --cov-report=term-missing"
